<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 开源榜 · 中文看懂好项目</title><meta name="description" content="GitHub 各领域开源项目榜单。中文说明用途、输入和输出，按创建周期和总 Star 排名。"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./">GitHub 开源榜</a><nav><button id="rules">榜单规则</button><a href="https://github.com" target="_blank" rel="noopener">GitHub ↗</a></nav></header>
<main><section id="board"><div class="section-head"><div><h1>开源项目排行榜 <span id="resultCount"></span></h1></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索名称、中文用途、输入输出" aria-label="搜索项目"></label></div>
<div class="periods" id="periods"><button data-period="all" class="active">累计总榜</button><button data-period="year">年榜</button><button data-period="quarter">季度榜</button><button data-period="month">月榜</button><button data-period="week">周榜</button><button data-period="day">日榜</button></div>
<div id="areas" class="areas"><button data-area="all" class="active">全部项目</button><button data-area="ai">AI 项目</button><button data-area="other">其他领域</button></div>
<div class="filters"><div class="selectors"><label>领域 <select id="domain" aria-label="项目领域"><option value="all">全部领域</option><option value="ai">AI</option><option value="devtools">开发工具</option><option value="web">网站与前端</option><option value="data">数据库与数据</option><option value="systems">系统与运维</option><option value="productivity">办公与效率</option><option value="media">影音与创作</option><option value="learning">学习资料</option><option value="games">游戏</option><option value="other">其他 / 待分类</option></select></label><label>类型 <select id="type" aria-label="项目类型"><option value="all">全部类型</option><option value="projects">应用 / 框架</option><option value="skills">Skills</option><option value="plugins">插件</option><option value="mcp">MCP 服务</option><option value="collections">合集目录</option></select></label></div><label>所属日期 <input id="date" type="date" aria-label="榜单所属日期"></label></div>
<div class="archive"><span id="periodText"></span><label>数据版本 <select id="snapshot"><option value="latest">最新采集</option></select></label></div><p id="status" role="status">正在加载项目…</p>
<div class="table-head"><span>排名 / 项目 · 中文用途与输入输出</span><span>总 STAR</span><span>创建日期</span></div><div id="list"></div><div id="pagination" class="pagination"></div>
<div class="bottom-note"><span>项目按创建时间筛选，按总 Star 排序 · 当前为已收录项目榜单。</span><span>北京时间</span></div></section>
<footer><a class="brand" href="./">GitHub 开源榜</a><span>非 GitHub 官方 · 更新于 <time id="updated">—</time></span></footer></main>
<dialog id="dialog"><button id="close" aria-label="关闭">×</button><div id="detail"></div></dialog><script type="module" src="app.js"></script></body></html>
