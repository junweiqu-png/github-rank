name: Collect and deploy GitHub ranking
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

concurrency:
  group: ranking-pages
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        name: Update only when three days have elapsed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const last = Date.parse(JSON.parse(readFileSync('dist/data/latest.json', 'utf8')).updated_at);
          const due = process.env.EVENT_NAME !== 'schedule' || !Number.isFinite(last) || Date.now() - last >= 3 * 24 * 60 * 60 * 1000;
          appendFileSync(process.env.GITHUB_OUTPUT, 'due=' + due + '\n');
          console.log(due ? 'Update is due' : 'Less than three days since last update; skipping');
          NODE
  build:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect.mjs
      - name: Verify rankings and catalog
        run: node --test
      - name: Keep data and daily snapshots in Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update public repository rankings and snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
